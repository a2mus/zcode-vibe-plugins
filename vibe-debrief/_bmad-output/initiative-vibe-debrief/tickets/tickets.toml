# v0.3.0 hardening wave — epic set, in build order.
# Table order is build order. `id` is permanent, never reused.

[[epic]]
id = 1
slug = "epic-test-suite"
title = "Zero-dependency test suite"
description = "`node --test tests/` runs green on Node >= 20 with one command and is the recorded verification gate for engine, state, export and transport behavior. It hands off the spawned-process harness and temp-workspace fixtures to epics 2-4, and the diagram/export regression tests to epic 3."
covers = ["R8"]

[[epic]]
id = 2
slug = "epic-atomic-state"
title = "Atomic state writes"
description = "Concurrent MCP and hook processes never leave a torn or partial state file; a write lands whole or the previous state survives, with Stop-hook latency at or under 50ms. It hands off the finished write path in scripts/debrief-engine.mjs."
covers = ["R9"]
after = [{ epic = 1, needs = "the spawned-process harness and temp-workspace fixtures" }]

[[epic]]
id = 3
slug = "epic-theme-parity"
title = "Light-theme parity"
description = "One theme-token contract drives the panel SVG diagram, the Canvas explainer and the standalone export, so both themes render legibly. It hands off the final panel markup and the theme-token contract."
covers = ["R10"]
after = [
  { epic = 1, needs = "the diagram and export regression tests" },
  { epic = 2, needs = "the finished write path in scripts/debrief-engine.mjs, so the same file is edited once" }
]

[[epic]]
id = 4
slug = "epic-panel-a11y"
title = "Keyboard and assistive-tech panel"
description = "The panel works by keyboard alone, announces changes to assistive technology, honors reduced motion, and ships as v0.3.0 with all four version locations synced, checked by scripts/check-version-sync.mjs and the full suite."
covers = ["R11", "R12"]
after = [
  { epic = 1, needs = "the suite the release gate runs" },
  { epic = 2, needs = "the shipped atomic write path" },
  { epic = 3, needs = "the final panel markup and theme token contract" }
]