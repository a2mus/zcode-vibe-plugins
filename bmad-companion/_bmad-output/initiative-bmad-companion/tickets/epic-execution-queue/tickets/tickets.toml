# Epic 5: Multi-task execution queue & workflow compiler — story breakdown.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Queue lifecycle tracer (add -> start-task -> complete-task -> get)"
description = "Tracer bullet: builds on Epic 1's harness (1.1) to prove the thinnest manageBmadTaskQueue path — add a task, start-task, complete-task, get — transitioning queued -> running -> done with taskQueue persisted via savePersistedState (C4) and rendered by buildTaskQueueView. Hands off the queue persistence baseline to Stories 2-5 and the start-task/complete-task actions to Epic 6."
verify = "Run `node --test tests/` and confirm the lifecycle test drives add -> start-task -> complete-task -> get through queued/running/done with state persisted via savePersistedState."
covers = ["R1"]
after = ["1.1"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "14-action queue contract + per-task model/reviewMode/executionMode"
description = "Builds on Story 1's lifecycle to harden all 14 manageBmadTaskQueue actions (get/add/add-epic/update-item/set-review-mode/set-execution-mode/reorder/remove/clear/start-queue/start-task/complete-task/pause-queue/generate-workflow) with per-task model, reviewMode none|quick|thorough, executionMode dynamic-workflow|separate-sessions, set-review-mode applyToAll, and add-epic includeDone. Hands off the full action set to Stories 3-5."
verify = "Run `node --test tests/` and confirm each of the 14 actions mutates the queue per contract, reorder/remove/clear/pause behave, and set-review-mode applyToAll updates every task."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Review-mode prompt shaping (none/quick/thorough)"
description = "Builds on Story 1's queue to harden buildEffectiveTaskPrompt: compile effectivePrompt per reviewMode — none (oneshot + deterministic verification only), quick (oneshot + single self-review pass), thorough (multi-lens BMAD code review gate) — with 100% adherence (SM-5). Hands off the shaped prompts to Story 4's workflow compiler."
verify = "Run `node --test tests/` and confirm each reviewMode produces its oneshot/self-review/multi-lens effectivePrompt and that no mode leaks review instructions into a none task."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Dual execution engine generation (.dwf.ts + step-updater / CreateSession plan)"
description = "Builds on Story 1's queue and Story 3's shaped prompts to harden generateQueueWorkflowFiles: on start-queue/generate-workflow emit .zcode/workflows/bmad-task-queue.dwf.ts + .zcode/bmad-companion/queue-step-updater.mjs (dynamic-workflow) or a sequential CreateSession+WaitSessions orchestration plan (separate-sessions), confined to workspaceRoot with per-task model/reviewMode preserved (DEC-5). Hands off generated execution artifacts to Epic 6's hook auto-advance."
verify = "Run `node --test tests/` and confirm dynamic-workflow emits a parseable .dwf.ts + step-updater carrying each task's model/reviewMode, and separate-sessions emits a CreateSession+WaitSessions plan, both under workspaceRoot."
covers = ["R3"]
after = [1, 3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Queue MCP tool contract + storyOverrides sync"
description = "Builds on Story 1's lifecycle to harden the bmad_queue_manage handler returning { queueResult: { ok, action, queue, workflowPath?, executionPrompt? }, state: ScanResult } and keep taskQueue synchronized with storyOverrides on complete-task (SM-5 counter-metric). Hands off the synced queue/state contract to Epic 6."
verify = "Run `node --test tests/` and confirm the handler returns the documented queueResult+state shape and complete-task updates the matching storyOverrides entry so taskQueue and storyOverrides agree."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

