[[entry]]
id = 7
type = "story"
title = "Closing end-to-end suite (UJ-1-UJ-4 tracer paths)"
description = "Integration gate after the refactor sweep: builds on Epic 1's harness and Epics 2-6 behavior to add a cross-epic end-to-end suite exercising UJ-1 (edit mid-poll + clean-session launch), UJ-2 (dual progress + safe reconcile), UJ-3 (queue epic + review gates + workflow), and UJ-4 (artifact inspect/open diff), asserting SM-1-SM-5. This is the initiative's recorded one-command verification gate (R23 closing suite)."
verify = "Run `node --test tests/` and confirm the end-to-end suite passes all four user-journey tracer paths and the SM-1-SM-5 assertions, with the full suite green on Node 18+."
