# Epic 6: Lifecycle hooks, 4-tier model router & closing end-to-end suite — story breakdown.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "SessionStart context-injection tracer"
description = "Tracer bullet: builds on Epic 1's hook stdout harness (1.3) to prove the thinnest hook path — SessionStart scans the workspace and emits a single JSON stdout line with additionalContext carrying smart-vs-static metrics, active provider counts, top 3 /bmad-<skill> \"<prompt>\" commands + recommended models, and companion rules. Hands off the hook scan/injection baseline to Stories 2-5."
verify = "Run `node --test tests/` and confirm the SessionStart hook emits one parseable JSON stdout line whose additionalContext includes smart-vs-static metrics, provider counts, and three contextual commands with providerId/modelId."
covers = ["R1"]
after = ["1.3"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "4-tier model scorer + enabled-model resolution"
description = "Builds on Story 1's scan baseline to harden recommendModelForBmadSkill/discoverConfiguredModels: resolve enabled models from state.json hostModels (ListModels) or ~/.zcode/v2/provider_config.json, exclude enabled===false/disabledReason, score against modelProfile (deep-reasoning/creative-ux/agentic-coding/planning-fast), and return top providerId/modelId + tier label + rationale (A-4). Hands off ranked models to Stories 3-5 and the recommendation contract."
verify = "Run `node --test tests/` and confirm disabled models are excluded, live hostModels override disk config, and each modelProfile returns the expected top providerId/modelId with a tier label and rationale."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Workspace-confined artifact discovery + diffing"
description = "Builds on Story 1's scan baseline to harden scanBmadWorkspace discovery: walk _bmad-output/, docs/, AGENTS.md, CONTEXT.md at depth<=4, compute per-artifact git status + git diff previews with normalized / paths confined to workspaceRoot, cap heuristic reads at 24-30KB and git subprocesses at 2500ms (C10, C3). Hands off bounded discovery to Stories 4-5."
verify = "Run `node --test tests/` and confirm discovery never exceeds depth 4, rejects ../ escapes, caps file reads and git timeouts, and returns normalized / artifact paths with git status/diff."
covers = ["R6"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "UserPromptSubmit + PostToolUse hooks (queue auto-start + file tracking)"
description = "Builds on Story 1's hook baseline and Epic 5's queue lifecycle (5.1) to harden UserPromptSubmit (store lastUserPrompt, reset recentTouchedFiles, auto start-task a matching queued task) and PostToolUse (record up to 15 workspace-relative paths on Write/Edit/MultiEdit). Hands off the auto-start path to Story 5."
verify = "Run `node --test tests/` and confirm UserPromptSubmit stores the prompt, resets touched files, and auto-starts a matching task, while PostToolUse records <=15 workspace-relative paths for Write/Edit/MultiEdit."
covers = ["R2", "R3"]
after = [1, "5.1"]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Stop hook turn synthesis + queue auto-advance + optional LLM"
description = "Builds on Story 1's hook baseline, Story 4's auto-start, and Epic 5's queue (5.1) to harden Stop: increment turnCount, store lastAssistantMessage, auto complete-task a running single-session task, and optionally call BMAD_COMPANION_OPENAI_KEY/OPENAI_API_KEY synthesis bounded by AbortSignal.timeout(4500) with silent fallback and <=350ms deterministic / <=4800ms LLM budget (C11, C12). Hands off the turn-synthesis baseline to the closing suite."
verify = "Run `node --test tests/` and confirm Stop increments turnCount, stores the message, auto-completes a running task, and with no key falls back silently within the deterministic budget; a stubbed slow LLM is aborted at 4500ms."
covers = ["R4"]
after = [1, 4, "5.1"]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Refactor sweep"
description = "Cleanup only, after Stories 1-5: deduplicate hook dispatch/scorer/discovery helpers, normalize additionalContext assembly and timeout handling, and tighten stdout isolation; scope set at start from deferred review findings. No new behavior."
verify = "Run `node --test tests/` green and confirm no duplicated hook/scorer helper remains and every hook still emits a single JSON stdout line."
covers = []
after = [1, 2, 3, 4, 5]
hitl = false
