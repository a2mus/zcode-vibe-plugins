# Epic 4: 5s polling safety, accessibility & contrast parity — story breakdown.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Poll-loop guard tracer (visible-gated 5s poll + isRefreshing + stash/flush)"
status = "done"
description = "Tracer bullet: builds on Epic 2's frozen ScanResult contract (2.1) to prove the thinnest panel path — a visibility-gated 5000ms poll serialized by isRefreshing, guarded by isUserInteractingWithForm (textarea/input focus or 15000ms select window), stashing pendingWorkspaceState mid-flight and flushing via flushPendingState on focusout/change/Escape/Tab <=100ms with zero lost edits. Verified with a stubbed-document node:test harness. Hands off the guard baseline to Stories 2-4."
verify = "Run `node --test tests/panel-guards.test.mjs` and confirm a guarded poll stashes then flushes on focusout, a hidden document skips the poll, and overlapping polls return immediately under the isRefreshing lock."
covers = ["R1", "R2", "R3"]
after = ["2.1"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "User edit preservation + section signature diffing regression"
status = "done"
description = "Builds on Story 1's guard baseline to harden resolveUserPrompt/resolveUserModel (keep userEditedPrompts/userSelectedModels while base===serverCmd/serverModel, drop when base changes or the chosen model leaves availableModels) and lastSectionSignatures per-section early-return so innerHTML is replaced only when data differs; explicit user actions still render immediately. Hands off the non-destructive render baseline to Stories 3-4."
verify = "Run `node --test tests/` and confirm an unchanged-base poll preserves an in-progress prompt/model edit, a changed base resets it, an unchanged section signature skips innerHTML, and an explicit action renders while focused."
covers = ["R3"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Accessibility floor: close AD-1-AD-5"
status = "done"
description = "Builds on Story 1's render baseline to close EXPERIENCE.md accessibility deviations in assets/panel.html: AD-1 visible .cmd-textarea focus ring (>=3:1), AD-2 ARIA role=tablist/tab/tabpanel + aria-selected + arrow-key navigation, AD-3 #toastBanner role=status/aria-live (polite, errors assertive), AD-4 associated queue/editor labels (for/id), AD-5 prefers-reduced-motion gating of .pulse-dot. Keeps native keyboard operability and the postMessage bridge."
verify = "Run a web-gui-tester keyboard/AT checklist and confirm textarea focus is visible, tabs expose ARIA semantics + arrow keys, toasts announce, labels associate, and the pulse stops under prefers-reduced-motion."
covers = ["R4"]
after = [1]
hitl = false
risk = "medium"

