# Epic 3: Dual progress tracking & safe tracker reconciliation — story breakdown.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Dual-progress scan tracer (v6 YAML + v7 TOML fixture -> declared vs smart)"
description = "Tracer bullet: builds on Epic 1's fixtures (1.1) to seed a temp workspace with sprint-status.yaml + tickets.toml + story plans + a passing test report, then proves scanBmadWorkspace parses them with the zero-dep parsers and returns both declaredDoneStories/declaredOverallPct and smartDoneStories/smartOverallPct/reconciledStoriesCount with a smartReason per upgraded story (metric-computation part of R1). Hands off the dual-metric fixture to Stories 2-3."
verify = "Run `node --test tests/` and confirm the scan test asserts both declared* and smart* metric sets and a non-empty smartReason for an evidence-upgraded story on the seeded v6+v7 fixture."
covers = ["R1"]
after = ["1.1"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Smart evidence evaluator rules"
description = "Builds on Story 1's dual-metric fixture to harden the evidence evaluator (evidence-rules part of R1): upgrade smartStatus to done only on storyOverrides done, plan done/completed/shipped, passing report failCount===0, or completed retrospective; hold in-progress/review and emit a high-priority remediation recommendation on failCount>0 (C12). Hands off the verified-status engine to Story 3."
verify = "Run `node --test tests/` and confirm each evidence path upgrades to done, a failing report (failCount>0) holds status and produces a remediation recommendation, and an unverified story stays declared-only."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Non-destructive reconcile + .bak + audit ledger"
description = "Builds on Story 1's fixture to harden reconcileWorkspaceTrackers disk mutation: dryRun:true writes nothing; live writes <tracker>.bak before modify (unless backup:false), updates story keys + summary header counters in place preserving comments/indentation and unrelated keys, and appends an audit record to .zcode/bmad-companion/reconciliation-log.json (C8, SM-3). Hands off the reconciled tracker baseline to Story 4 and Epic 5."
verify = "Run `node --test tests/` and confirm dryRun leaves disk untouched, live reconcile creates a .bak per modified file, preserves comments/unrelated keys, updates header counters, and appends a reconciliation-log.json entry."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Reconcile MCP tool contract (dryRun/target/backup)"
description = "Builds on Story 3's reconciler to harden the bmad_reconcile_trackers handler: honor dryRun, target all|v6-yaml|v7-tickets, and backup default true, returning the flat ReconcileResult ({ reconciledAt, dryRun, target, changesCount, updatedFiles, changes, before, after, newScan }). Hands off the reconcile tool contract to Epic 5's queue sync."
verify = "Run `node --test tests/` and confirm the handler returns the documented ReconcileResult shape and that target v6-yaml/v7-tickets each modify only their tracker family."
covers = ["R3"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Cleanup only, after Stories 1-4: deduplicate parser/header-counter helpers, normalize evidence-rule branching, and tighten reconciler error paths; scope set at start from deferred review findings. No new behavior."
verify = "Run `node --test tests/` green and confirm no duplicated parser or header-counter helper remains in scripts/bmad-engine.mjs."
covers = []
after = [1, 2, 3, 4]
hitl = false
risk = "low"
