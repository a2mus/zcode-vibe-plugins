[[entry]]
id = 3
type = "story"
title = "Clean-session launch + OS automation fallback"
status = "done"
description = "Builds on Story 1's contract and Epic 1's fixtures (1.1) to harden bmad_prepare_new_session: clipboard copy + preparedSession persistence, win32 PowerShell SendKeys ^n/^v, darwin pbcopy+osascript, linux wl-copy/xclip/xsel+xdotool when openDirectly!==false, bounded by hard timeouts (8000/6000/2500ms) and <=1500ms p95, with graceful clipboard-only fallback (copied:true) + instructional toast when keystrokes are blocked and zero auto-submissions (SM-4, A-2). A person observes the pre-pasted fresh session per OS."
verify = "Run `node --test tests/` for the clipboard/fallback/timeout logic, then on each supported OS launch a recommendation and confirm a fresh ZCode session opens with the prompt pre-pasted (no auto-submit); block keystrokes and confirm clipboard-only fallback with a toast."
covers = ["R4"]
after = [1, "1.1"]
hitl = true
risk = "high"

