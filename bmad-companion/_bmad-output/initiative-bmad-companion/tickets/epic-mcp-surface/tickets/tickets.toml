[[entry]]
id = 1
type = "story"
title = "Read-only tool contract tracer (open_companion -> get_state -> recommend_next)"
status = "done"
description = "Tracer bullet: builds on Epic 1's MCP stdio harness (1.2) to prove the thinnest handler -> engine scan -> structuredContent path across bmad_open_companion, bmad_get_state, and bmad_recommend_next, asserting the full ScanResult shape (metrics/phases/epics/recommendations/availableModels/taskQueue/artifacts) and that every recommendation matches the SM-1 contextual-prompt regex with a valid providerId/modelId. Hands off the frozen ScanResult contract to Stories 2-4 and Epics 3-5."
