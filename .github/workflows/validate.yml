name: Validate Marketplace Plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate marketplace and plugin syntax
        run: node scripts/validate.mjs
      - name: Test bmad-companion
        working-directory: bmad-companion
        run: node --test tests/
      - name: Check bmad-companion version sync
        working-directory: bmad-companion
        run: node scripts/check-version-sync.mjs
      - name: Test vibe-debrief
        working-directory: vibe-debrief
        run: node --test tests/
      - name: Check vibe-debrief version sync
        working-directory: vibe-debrief
        run: node scripts/check-version-sync.mjs
